<header class="header">
  <div class="header__left">
    <button class="header__hamburger" type="button" aria-label="Toggle menu" (click)="toggleMenu()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="header__search">
      <svg class="header__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" placeholder="Type to search" aria-label="Search" />
    </div>
  </div>

  <div class="header__right">
    <button class="header__icon-btn" type="button" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="header__notif-badge">3</span>
    </button>

    <div class="header__user">
      <button class="header__avatar" type="button" (click)="toggleDropdown()" aria-label="User menu" [attr.aria-expanded]="dropdownOpen()">
        <span>JD</span>
      </button>

      @if (dropdownOpen()) {
        <div class="header__dropdown">
          <button type="button" class="header__dropdown-item" routerLink="/admin/profile" (click)="toggleDropdown()">Profil</button>
          <button type="button" class="header__dropdown-item header__dropdown-item--danger" (click)="logout()">Logout</button>
        </div>
      }
    </div>
  </div>
</header>
