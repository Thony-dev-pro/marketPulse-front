<div class="row">
  <div class="cell cell--check">
    <input
      type="checkbox"
      [checked]="selected()"
      (change)="selectionChanged.emit($any($event.target).checked)"
      [attr.aria-label]="'Select ' + product().name"
    />
  </div>

  <div class="cell cell--details">
    <div class="details-text">
      <span class="name">{{ product().name }}</span>
    </div>
  </div>

  <div class="cell cell--category">
    <span class="tag">{{ product().category.name }}</span>
  </div>

  <div class="cell cell--unit">
    <span>{{ product().unit }}</span>
  </div>

  <div class="cell cell--status">
    <span class="status">{{ product().status === 1 ? 'Activate' : 'Desactivate' }}</span>
  </div>

  <div class="cell cell--description">
    <span class="desc">{{ product().description }}</span>
  </div>

  <div class="cell cell--actions">
    <button class="btn-edit" type="button" (click)="editClicked.emit(product())">Edit</button>
    <button class="btn-desactivate" type="button" (click)="desactivateClicked.emit(product())">Desactivate</button>
    <button class="btn-menu" type="button" (click)="menuClicked.emit(product())" aria-label="More options">···</button>
  </div>
</div>
