<div class="products-page">
  <app-product-toolbar (searchValue)="onSearchProduct($event)" />

  <app-product-table
    [products]="products()"
    (editClicked)="onEdit($event)"
    (desactivateClicked)="onDesactivate($event)"
    (menuClicked)="onMenu($event)"
  />

  @if (modalOpen()) {
    <app-product-modal
      (close)="modalOpen.set(false)"
      (save)="onSaveProduct($event)"
    />
  }
</div>
