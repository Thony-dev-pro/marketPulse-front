<div class="products-page">
  <div class="page-header">
    <app-product-toolbar (searchValue)="onSearchProduct($event)" />
    <select class="form-select" aria-label="Filter by category" (change)="onChangeCategory($event)">
      <option value="">All categories</option>
      @for (cat of categories(); track cat.id) {
        <option [value]="cat.id">{{ cat.name }}</option>
      }
    </select>
    <button class="btn-primary" (click)="modalOpen.set(true)">New Product</button>
  </div>

  <app-product-table
    [products]="products()"
    (editClicked)="onEdit($event)"
    (desactivateClicked)="onDesactivate($event)"
    (menuClicked)="onMenu($event)"
  />

  @if (modalOpen()) {
    <app-product-modal
      (close)="modalOpen.set(false)"
      (save)="onSaveProduct($event)"
    />
  }

  @if (modalOpenEdit()) {
    <app-product-edit-modal
      [product]="productEdit()"
      (close)="modalOpenEdit.set(false)"
      (save)="onSaveEditProduct($event)"
    />
  }
</div>
