<div class="products-page">
  <div class="products-page__header">
    <h1 class="products-page__title">Products</h1>
    <button class="btn-new" type="button" (click)="onNewProduct()">
      <span class="btn-new__icon" aria-hidden="true">+</span>
      NEW PRODUCT
    </button>
  </div>

  <app-product-table
    [products]="products()"
    (editClicked)="onEdit($event)"
    (desactivateClicked)="onDesactivate($event)"
    (menuClicked)="onMenu($event)"
  />

  @if (modalOpen()) {
    <app-product-modal
      (close)="modalOpen.set(false)"
      (save)="onSaveProduct($event)"
    />
  }
</div>
